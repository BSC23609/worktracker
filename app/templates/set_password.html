<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set password &middot; {{ app_name }}</title>
<link rel="stylesheet" href="/static/style.css?v=6">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0d1421">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Work Tracker">
</head><body>
<main class="wrap" style="max-width:400px;margin-top:7vh">
  <div style="text-align:center;margin-bottom:1.2rem">
    <img src="/static/logos/group.png" alt="The Bharat Steel Group" class="login-logo">
    <h1 style="margin-top:.4rem">Set your password</h1>
  </div>
  {% if err %}<div class="flash err">{{ err }}</div>{% endif %}
  {% if valid %}
  <form method="post" action="/reset-password" class="card">
    <p class="help">Hi {{ name }}, choose a password for your {{ app_name }} account.</p>
    <label>New password</label>
    <input type="password" name="new" required minlength="6" autofocus autocomplete="new-password">
    <label>Confirm new password</label>
    <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
    <button class="btn" style="width:100%">Save password</button>
  </form>
  {% else %}
  <div class="card">
    <div class="flash err" style="margin:0">Your reset session has expired.</div>
    <p class="help" style="margin-top:.8rem">Start again from <a href="/forgot">Forgot password</a>.</p>
  </div>
  {% endif %}
</main>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body></html>
