<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{ app_name }}</title>
<link rel="stylesheet" href="/static/style.css">
</head><body>
<main class="wrap" style="max-width:400px;margin-top:8vh">
  <div style="text-align:center;margin-bottom:1.2rem">
    <span class="brand-mark" style="font-size:1rem">BSG</span>
    <h1 style="margin-top:.6rem">{{ app_name }}</h1>
    <p class="help">Bharat Steel Group</p>
  </div>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <form method="post" action="/auth/login" class="card">
    <label>Email</label>
    <input type="email" name="email" required autofocus autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" required autocomplete="current-password">
    <button class="btn" style="width:100%">Sign in</button>
  </form>
</main>
</body></html>
