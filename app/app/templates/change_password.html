{% extends "base.html" %}
{% block title %}Change password · {{ app_name }}{% endblock %}
{% block body %}
<h1>Change password</h1>
{% if me.must_reset %}<p class="help">You're using the default password. Please set a new one to continue.</p>{% endif %}
<form method="post" action="/change-password" class="card" style="max-width:420px">
  <label>Current password</label>
  <input type="password" name="current" required>
  <label>New password</label>
  <input type="password" name="new" required minlength="6">
  <label>Confirm new password</label>
  <input type="password" name="confirm" required minlength="6">
  <button class="btn">Update password</button>
</form>
{% endblock %}
